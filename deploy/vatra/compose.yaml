# Vatra hub stack: /srv/vatra/compose.yaml (P4-03). One file, every image pinned by digest in .env
# (written by the updater from the signed channel manifest; never `latest`).
#   docker compose --env-file /srv/vatra/.env up -d
# Home Assistant and ESPHome need host networking (mDNS, HomeKit, ESPHome discovery); Vatra joins
# them on the host network so http://127.0.0.1 reaches HA. State: /srv/vatra/{data,ha,esphome,mosquitto}.
name: vatra

services:
  vatra:
    image: ${VATRA_IMAGE:?set VATRA_IMAGE=ghcr.io/<owner>/vatra@sha256:... in .env}
    container_name: vatra
    restart: unless-stopped
    network_mode: host
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      PORT: "3737"
      HOSTNAME: 0.0.0.0
    volumes:
      - /srv/vatra/data:/data
      # .next/cache must be writable for image optimisation
      - vatra-cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3737/api/discover').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      mosquitto:
        condition: service_healthy

  homeassistant:
    image: ${HA_IMAGE:?set HA_IMAGE=ghcr.io/home-assistant/home-assistant@sha256:... in .env}
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ:-Europe/Bucharest}
    volumes:
      - /srv/vatra/ha:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -o /dev/null http://127.0.0.1:8123/manifest.json || exit 1",
        ]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3

  esphome:
    image: ${ESPHOME_IMAGE:?set ESPHOME_IMAGE=ghcr.io/esphome/esphome@sha256:... in .env}
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      ESPHOME_DASHBOARD_USE_PING: "true"
    volumes:
      - /srv/vatra/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6052/ || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  mosquitto:
    image: ${MOSQUITTO_IMAGE:?set MOSQUITTO_IMAGE=eclipse-mosquitto@sha256:... in .env}
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - /srv/vatra/mosquitto/config:/mosquitto/config
      - /srv/vatra/mosquitto/data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vatra-cache:
