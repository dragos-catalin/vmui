# A/B image: host keys live on the data partition (generated by vatra-firstboot), so they stay the
# same across OS updates and the read-only system slots never carry a key.
HostKey /var/lib/vatra/ssh/ssh_host_ed25519_key
HostKey /var/lib/vatra/ssh/ssh_host_ecdsa_key
HostKey /var/lib/vatra/ssh/ssh_host_rsa_key
