# Vatra hub for Raspberry Pi 5 (and CM5 boards with SD/eMMC boot).
#   rpi-image-gen build -S deploy/vatra/pi-image -c vatra-pi5.yaml -- IGconf_vatra_bakedir=<dir>
device:
  layer: rpi5
  hostname: vatra
  user1: vatra

image:
  layer: image-rpios
  name: vatra-hub-pi5
  boot_part_size: 200%
  root_part_size: 200%
  devid_scheme: partuuid

layer:
  base: vatra-hub
