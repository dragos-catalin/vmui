# XcodeGen spec for the Vatra iPhone / iPad / Apple Watch app (P8). The .xcodeproj is generated by
# scripts/build.sh and never committed. Signing team comes from $DEVELOPMENT_TEAM (no secrets here).
# Targets:
#   Vatra                     app (ro.vatra.app): pairing, Home / Lights / Alerts / Settings, App Intents, NFC
#   VatraWidgets              WidgetKit: house widget, Control Center controls, intercom Live Activity
#   VatraNotificationService  NSE: fetches a trimmed card, attaches action buttons, drops cards this member cannot see
#   VatraWatch                watchOS app (ro.vatra.app.watchkitapp) + complications (WidgetKit accessory)
# Every target shares the keychain group ro.vatra.shared so they all act with the same per-device vmd_ token.
name: Vatra
options:
  bundleIdPrefix: ro.vatra
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
packages:
  VatraCore:
    path: VatraCore
targets:
  Vatra:
    type: application
    platform: iOS
    sources:
      - path: Vatra
      - path: Shared
    dependencies:
      - package: VatraCore
      - target: VatraWidgets
      - target: VatraNotificationService
      - target: VatraWatch
    entitlements:
      path: Vatra/Vatra.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        keychain-access-groups: ['$(AppIdentifierPrefix)ro.vatra.shared']
        com.apple.security.application-groups: [group.ro.vatra]
        com.apple.developer.nfc.readersession.formats: [NDEF, TAG]
    info:
      path: Vatra/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ro.vatra.app
            CFBundleURLSchemes: [vatra]
        NSBonjourServices: [_vatra._tcp]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UIBackgroundModes: [remote-notification, location]
        NSAppTransportSecurity:
          # A self-hosted hub is reached on the LAN over plain http (vatra.local, 192.168.x.y) until the
          # product relay gives it a certificate (P10); everything public stays https.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.vatra.app
        PRODUCT_NAME: Vatra
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vatra
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Vatra uses the camera only to scan the pairing code your hub shows.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Vatra looks for your home hub on this Wi-Fi network.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Vatra notes where home is, so it can tell the hub when you arrive or leave.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Vatra tells your hub only "home" or "away" when you arrive or leave, never your position.
        INFOPLIST_KEY_NFCReaderUsageDescription: Vatra reads and writes house-action stickers.

  VatraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VatraWidgets
      - path: Shared
    dependencies:
      - package: VatraCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    entitlements:
      path: VatraWidgets/VatraWidgets.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)ro.vatra.shared']
        com.apple.security.application-groups: [group.ro.vatra]
    info:
      path: VatraWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.vatra.app.widgets
        PRODUCT_NAME: VatraWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vatra
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES

  VatraNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: VatraNotificationService
      - path: Shared
    dependencies:
      - package: VatraCore
    entitlements:
      path: VatraNotificationService/VatraNotificationService.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)ro.vatra.shared']
        com.apple.security.application-groups: [group.ro.vatra]
    info:
      path: VatraNotificationService/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.vatra.app.nse
        PRODUCT_NAME: VatraNotificationService
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vatra
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES

  VatraWatch:
    type: application
    platform: watchOS
    sources:
      - path: VatraWatch
      - path: Shared
        excludes: [IntentsShared.swift]
    dependencies:
      - package: VatraCore
      - target: VatraWatchWidgets
    entitlements:
      path: VatraWatch/VatraWatch.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)ro.vatra.shared']
        com.apple.security.application-groups: [group.ro.vatra]
    info:
      path: VatraWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: ro.vatra.app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.vatra.app.watchkitapp
        PRODUCT_NAME: VatraWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vatra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  VatraWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: VatraWatchWidgets
      - path: Shared
        excludes: [IntentsShared.swift]
    dependencies:
      - package: VatraCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: VatraWatchWidgets/VatraWatchWidgets.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)ro.vatra.shared']
        com.apple.security.application-groups: [group.ro.vatra]
    info:
      path: VatraWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.vatra.app.watchkitapp.widgets
        PRODUCT_NAME: VatraWatchWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vatra
        SKIP_INSTALL: YES

schemes:
  Vatra:
    build:
      targets:
        Vatra: all
    run:
      config: Debug
    archive:
      config: Release
