# Same baseline as E:\gh\vitals\apps\android (checked 2026-09-28) plus the
# push / location libraries, checked against Google Maven and Maven Central on
# 2026-11-07. Bump whole groups together; the Compose BOM decides every
# androidx.compose artefact.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
core = "1.19.1"
splashscreen = "1.2.0"
datastore = "1.2.1"
work = "2.12.0"
glance = "1.2.0"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
camerax = "1.6.2"
mlkit-barcode = "17.3.0"
wear-compose = "1.7.0"
wear-tiles = "1.6.2"
protolayout = "1.4.2"
complications = "1.3.0"
tv-material = "1.1.0"
firebase-messaging = "26.0.1"
unifiedpush = "3.3.5"
play-location = "21.4.0"
play-wearable = "20.0.1"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
