unifiedpush = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
play-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-location" }
play-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-wearable" }
