# Home Assistant package for the ambilight rig.
# Installed by scripts/ambilight.ps1 -InstallHaScenes into
# /config/packages/ambilight.yaml, then core config is reloaded.
#
# Transport: HA -> Mosquitto -> HyperHDR MQTT client, topic HyperHDR/JsonAPI.
# One MQTT message may carry an ARRAY of JSON-API commands, and
# instance/switchTo inside the array retargets the following commands, so a
# single publish addresses every instance. The HTTP /json-rpc endpoint only
# hits instance 0 and cannot switch -- that is why MQTT.
#
# HyperHDR priorities (lower wins): screen grabber 245, HA light 50,
# effects we start here 40, notify flash 10.

script:
  # ---------------------------------------------------------------------
  # Daylight: the LED idle colours (DX Light red, case red) only make sense
  # in a dark room. Source of truth is binary_sensor.room_is_bright below;
  # the UDP bridges (ambilight/dxlight_bridge.py IdleGate) poll it every
  # minute and swap the idle frame for black while it is on. Movie mode is
  # NOT gated: the strips follow the picture whenever a source is on.
  #
  # Preference order: A51 light sensor (HA Companion app on the desk phone,
  # Settings -> Companion app -> Manage sensors -> Light sensor ON) when it
  # has reported in the last 30 min, else the sun. Nest Hub has a light
  # sensor but Google exposes it in no API, so it cannot be used.
  # ---------------------------------------------------------------------
  ambilight_all:
    alias: "Ambilight: send JSON-API to all instances"
    mode: queued
    fields:
      commands:
        description: JSON list of HyperHDR commands, applied to each instance
        example: '[{"command":"clear","priority":40}]'
    sequence:
      - action: mqtt.publish
        data:
          topic: HyperHDR/JsonAPI
          payload: >-
            {% set cmds = (commands | from_json) if commands is string else (commands | list) %}
            {% set ns = namespace(out=[]) %}
            {% for i in [0, 1, 2, 3, 4] %}
              {% set ns.out = ns.out + [{"command": "instance", "subcommand": "switchTo", "instance": i}] + cmds %}
            {% endfor %}
            {{ ns.out | to_json }}

  ambilight_room:
    alias: "Ambilight: send JSON-API to case + room only (not the monitor strip)"
    mode: queued
    fields:
      commands:
        description: JSON list of HyperHDR commands, applied to instances 1-4 (case, room, desk bar, MELK strip)
    sequence:
      - action: mqtt.publish
        data:
          topic: HyperHDR/JsonAPI
          payload: >-
            {% set cmds = (commands | from_json) if commands is string else (commands | list) %}
            {% set ns = namespace(out=[]) %}
            {% for i in [1, 2, 3, 4] %}
              {% set ns.out = ns.out + [{"command": "instance", "subcommand": "switchTo", "instance": i}] + cmds %}
            {% endfor %}
            {{ ns.out | to_json }}

  movie_mode_on:
    alias: "Movie mode ON"
    icon: mdi:movie-open
    sequence:
      - action: light.turn_off
        target: { entity_id: light.hyperhdr }
      # Instance 0 (the strip behind the Odyssey) always follows the screen;
      # movie mode only decides whether the case and the room join in.
      - action: script.ambilight_room
        data:
          commands:
            - { command: clear, priority: 40 }
            - {
                command: componentstate,
                componentstate: { component: SYSTEMGRABBER, state: true },
              }
      - action: light.turn_off
        target: { entity_id: light.star_projector }
      # MELK strip (light.led_argb): NOT touched here. HyperHDR instance 4 ->
      # ambilight/ble_lights.py drives it over the PC's own Bluetooth while
      # frames stream; only one BLE client can hold it, so an HA call now
      # would steal the link. The bridge releases it ~5 s after the last
      # frame, and movie_mode_off puts it back to warm white.
      # Desk Light Bar: NOT touched here. HyperHDR instance 3 -> Tuya Cloud
      # (ambilight/deskbar_bridge.py) colours it from the top of the picture
      # while movie mode is on; a colour_temp call now would fight it.

  movie_mode_off:
    alias: "Movie mode OFF (warm room)"
    icon: mdi:lightbulb-group
    sequence:
      - action: script.ambilight_room
        data:
          commands:
            - { command: clear, priority: 40 }
            - {
                command: componentstate,
                componentstate: { component: SYSTEMGRABBER, state: false },
              }
      # The desk-bar bridge hands the bar back to white mode ~5 s after the
      # last frame; wait for that before setting a colour temperature.
      - delay: { seconds: 7 }
      # HyperHDR leaves the HA lamps at their last frame colour; idle means
      # dark, and a bright room (sun/lux gate) means everything off.
      - action: light.turn_off
        target: { entity_id: [light.moodlight, light.ambience_light] }
      - if:
          - condition: state
            entity_id: binary_sensor.room_is_bright
            state: "on"
        then:
          - action: light.turn_off
            target: { entity_id: [light.desk_light_bar, light.led_argb] }
        else:
          - action: light.turn_on
            target: { entity_id: [light.desk_light_bar, light.led_argb] }
            data: { color_temp_kelvin: 3000, brightness_pct: 60 }

  music_mode:
    alias: "Music mode"
    icon: mdi:music
    fields:
      effect:
        description: HyperHDR music effect name
        default: "Music: stereo for LED strip (MULTI COLOR)"
    sequence:
      # Priority 40 already beats the grabber (245); leaving the grabber
      # running means "movie" is one `clear` away instead of a restart.
      - action: script.ambilight_all
        data:
          commands: >-
            {{ [{"command": "effect", "effect": {"name": effect | default("Music: stereo for LED strip (MULTI COLOR)")}, "priority": 40}] | to_json }}

  notify_flash:
    alias: "Notify flash"
    icon: mdi:bell-ring
    mode: queued
    fields:
      color:
        description: RGB list, e.g. [0,120,255]
        default: [0, 120, 255]
      duration_ms:
        default: 1500
    sequence:
      # Short-lived colour at a priority that beats everything; HyperHDR
      # falls straight back to whatever was showing. No state to restore.
      - action: script.ambilight_all
        data:
          commands: >-
            {{ [{"command": "color", "color": color | default([0,120,255]), "priority": 10, "duration": duration_ms | default(1500) | int}] | to_json }}

  # ---------------------------------------------------------------------
  # Copilot / agent-harness signals on the room bulbs (Calex via Smart Life).
  # Called by vmui /api/copilot/event, which is called by ~/.copilot/hooks.
  # `lights` = list of light entity ids, `color` = [r,g,b].
  # Every script snapshots the bulbs into scene.copilot_before and restores
  # it at the end, so a bulb that was warm-white 40 % comes back exactly so.
  # The snapshot is taken by the CALLER (vmui /api/copilot/event) via
  # script.copilot_snapshot BEFORE the alert script starts, and only when no
  # alert is running: a snapshot taken mid-pulse captures the alert colour as
  # the "original", and every later restore leaves the bulb stuck orange
  # (seen 2026-09-14). Calling it from inside the alert cannot work: the
  # alert script is already `on`, so the condition is always false.
  # ---------------------------------------------------------------------
  copilot_snapshot:
    alias: "Copilot: snapshot bulbs unless an alert is already showing"
    mode: queued
    fields:
      lights: { description: light entity ids }
    sequence:
      - if:
          - condition: state
            entity_id: script.copilot_ask
            state: "off"
          - condition: state
            entity_id: script.copilot_done
            state: "off"
          - condition: state
            entity_id: script.copilot_blocked
            state: "off"
          - condition: state
            entity_id: script.copilot_failed
            state: "off"
        then:
          - action: scene.create
            data:
              { scene_id: copilot_before, snapshot_entities: "{{ lights }}" }

  copilot_ask:
    alias: "Copilot: asteapta raspuns (puls agresiv)"
    icon: mdi:robot-confused
    mode: restart
    fields:
      lights:
        { description: light entity ids, example: '["light.ambience_light"]' }
      color: { default: [255, 90, 31] }
    sequence:
      # Fast double-pulse, 7 cycles x 1.44 s = ~10 s, then restore. Nothing
      # runs forever: a missed cancel (hook killed, vmui down) must not leave
      # the room orange. script.copilot_clear still cuts it short.
      - repeat:
          count: 7
          sequence:
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                { rgb_color: "{{ color }}", brightness_pct: 100, transition: 0 }
            - delay: { milliseconds: 180 }
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                { rgb_color: "{{ color }}", brightness_pct: 8, transition: 0 }
            - delay: { milliseconds: 180 }
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                { rgb_color: "{{ color }}", brightness_pct: 100, transition: 0 }
            - delay: { milliseconds: 180 }
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                { rgb_color: "{{ color }}", brightness_pct: 8, transition: 0 }
            - delay: { milliseconds: 900 }
      - action: scene.turn_on
        target: { entity_id: scene.copilot_before }
        data: { transition: 1 }

  copilot_clear:
    alias: "Copilot: opreste alerta si restaureaza"
    icon: mdi:robot-off
    mode: queued
    fields:
      lights: { description: light entity ids }
    sequence:
      - action: script.turn_off
        target: { entity_id: script.copilot_ask }
      - action: scene.turn_on
        target: { entity_id: scene.copilot_before }
        data: { transition: 1 }

  copilot_done:
    alias: "Copilot: gata (fade calm)"
    icon: mdi:robot-happy
    mode: queued
    fields:
      lights: { description: light entity ids }
      color: { default: [46, 204, 113] }
    sequence:
      - action: script.turn_off
        target: { entity_id: script.copilot_ask }
      - action: light.turn_on
        target: { entity_id: "{{ lights }}" }
        data: { rgb_color: "{{ color }}", brightness_pct: 70, transition: 1.5 }
      - delay: { seconds: 2 }
      - action: light.turn_on
        target: { entity_id: "{{ lights }}" }
        data: { rgb_color: "{{ color }}", brightness_pct: 25, transition: 1.5 }
      - delay: { seconds: 2 }
      - action: scene.turn_on
        target: { entity_id: scene.copilot_before }
        data: { transition: 2 }

  copilot_blocked:
    alias: "Copilot: comanda blocata (flash rosu)"
    icon: mdi:robot-dead
    mode: queued
    fields:
      lights: { description: light entity ids }
      color: { default: [255, 45, 45] }
    sequence:
      - repeat:
          count: 3
          sequence:
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                { rgb_color: "{{ color }}", brightness_pct: 100, transition: 0 }
            - delay: { milliseconds: 120 }
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                { rgb_color: "{{ color }}", brightness_pct: 5, transition: 0 }
            - delay: { milliseconds: 120 }
      - action: scene.turn_on
        target: { entity_id: scene.copilot_before }
        data: { transition: 0.5 }

  copilot_failed:
    alias: "Copilot: build/test esuat (flash galben)"
    icon: mdi:robot-angry
    mode: queued
    fields:
      lights: { description: light entity ids }
      color: { default: [255, 196, 0] }
    sequence:
      - repeat:
          count: 2
          sequence:
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                {
                  rgb_color: "{{ color }}",
                  brightness_pct: 100,
                  transition: 0.3,
                }
            - delay: { milliseconds: 500 }
            - action: light.turn_on
              target: { entity_id: "{{ lights }}" }
              data:
                {
                  rgb_color: "{{ color }}",
                  brightness_pct: 10,
                  transition: 0.3,
                }
            - delay: { milliseconds: 500 }
      - action: scene.turn_on
        target: { entity_id: scene.copilot_before }
        data: { transition: 1 }

automation:
  - id: ambilight_webhook_notify
    alias: "Ambilight: webhook -> notify flash"
    description: >
      POST https://home.dragoscatalin.ro/api/webhook/ambilight-notify
      with JSON {"color":[r,g,b],"duration_ms":1500}. Used by the phone
      (BuzzKill / Tasker / MacroDroid) for notification categories.
    triggers:
      - trigger: webhook
        webhook_id: ambilight-notify
        allowed_methods: [POST]
        local_only: false
    actions:
      - action: script.notify_flash
        data:
          color: "{{ trigger.json.color | default([0,120,255]) }}"
          duration_ms: "{{ trigger.json.duration_ms | default(1500) }}"

  - id: ambilight_webhook_mode
    alias: "Ambilight: webhook -> mode"
    description: 'POST /api/webhook/ambilight-mode {"mode":"movie"|"music"|"off"}'
    triggers:
      - trigger: webhook
        webhook_id: ambilight-mode
        allowed_methods: [POST]
        local_only: false
    actions:
      - choose:
          - conditions: "{{ trigger.json.mode == 'movie' }}"
            sequence: [{ action: script.movie_mode_on }]
          - conditions: "{{ trigger.json.mode == 'music' }}"
            sequence: [{ action: script.music_mode }]
        default: [{ action: script.movie_mode_off }]

  - id: ambilight_door_opened_flash
    alias: "Ambilight: main door opened -> amber flash"
    triggers:
      - trigger: state
        entity_id: binary_sensor.main_door_door
        to: "on"
    actions:
      - action: script.notify_flash
        data: { color: [255, 140, 0], duration_ms: 2500 }

  - id: ambilight_phone_notification_flash
    alias: "Ambilight: phone notification -> colour by app"
    description: >
      Companion app "Last notification" sensor (allow list on the phone:
      WhatsApp, Phone, Messages, Gmail). Colour per app, only while the
      screen grabber is what is showing, so a film never gets interrupted
      for longer than the flash.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: sensor.dragos_s_s25_ultra_last_notification
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.attributes.package is defined }}"
      - condition: template
        value_template: "{{ not trigger.to_state.attributes.is_ongoing | default(false) }}"
    actions:
      - variables:
          pkg: "{{ trigger.to_state.attributes.package }}"
          palette:
            com.whatsapp: [37, 211, 102]
            com.samsung.android.dialer: [0, 120, 255]
            com.google.android.dialer: [0, 120, 255]
            com.samsung.android.messaging: [120, 80, 255]
            com.google.android.apps.messaging: [120, 80, 255]
            com.google.android.gm: [234, 67, 53]
          color: "{{ palette[pkg] | default([255, 255, 255]) }}"
          # Calls keep ringing; everything else is a short pulse.
          duration: "{{ 6000 if 'dialer' in pkg else 1200 }}"
      - action: script.notify_flash
        data:
          color: "{{ color }}"
          duration_ms: "{{ duration }}"

# ---------------------------------------------------------------------------
# Daylight sensing (see the note above `script:`).
# ---------------------------------------------------------------------------
input_number:
  room_bright_lux:
    name: "Room is bright above (lux)"
    min: 5
    max: 500
    step: 5
    initial: 40
    unit_of_measurement: lx
    icon: mdi:brightness-6
  room_dark_lux:
    name: "Room is dark below (lux)"
    min: 1
    max: 400
    step: 1
    initial: 15
    unit_of_measurement: lx
    icon: mdi:brightness-4

input_boolean:
  ambilight_daylight_gate:
    name: "Ambilight: turn idle LEDs off in daylight"
    icon: mdi:weather-sunny
    initial: true

template:
  - binary_sensor:
      - name: "Room is bright"
        unique_id: ambilight_room_is_bright
        device_class: light
        icon: mdi:white-balance-sunny
        # Bright if EITHER says so. Sun above 3 deg is day, full stop -- the
        # phone lies flat on the desk under the monitor and read 10 lx at
        # 09:00 on a sunny morning (2026-09-15), so it cannot veto daylight.
        # The phone ADDS "room lamp is on at night". Hysteresis on both: sun
        # holds down to -3 deg, lux holds down to room_dark_lux.
        state: >-
          {% set lux = states('sensor.a51_light') %}
          {# age_min = age of the SAMPLE; the sensor sleeps with the screen off #}
          {% set fresh = is_number(lux)
             and is_number(state_attr('sensor.a51_light', 'age_min'))
             and (state_attr('sensor.a51_light', 'age_min') | int) < 30 %}
          {% set was = is_state('binary_sensor.room_is_bright', 'on') %}
          {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
          {% set by_sun = el > 3 or (was and el >= -3) %}
          {% set hi = states('input_number.room_bright_lux') | float(40) %}
          {% set lo = states('input_number.room_dark_lux') | float(15) %}
          {% set by_lux = fresh and ((lux | float) > hi or (was and (lux | float) >= lo)) %}
          {{ by_sun or by_lux }}
        attributes:
          source: >-
            {% set el = state_attr('sun.sun', 'elevation') | float(-90) %}
            {% set age = state_attr('sensor.a51_light', 'age_min') %}
            {% set fresh = is_number(states('sensor.a51_light')) and is_number(age) and (age | int) < 30 %}
            {{ 'sun' if el > 3 else ('a51' if fresh else 'sun') }}
          lux: "{{ states('sensor.a51_light') }}"
          sun_elevation: "{{ state_attr('sun.sun', 'elevation') }}"
  - binary_sensor:
      - name: "Ambilight idle allowed"
        unique_id: ambilight_idle_allowed
        icon: mdi:led-strip-variant
        # What the bridges actually read: idle colours are allowed unless the
        # gate is enabled AND the room is bright.
        state: >-
          {{ not (is_state('input_boolean.ambilight_daylight_gate', 'on')
                  and is_state('binary_sensor.room_is_bright', 'on')) }}
  - binary_sensor:
      # `light.hyperhdr` is the integration's OWN light: it is 'on' only while
      # HA holds priority 50 with a colour/effect. Movie mode runs the screen
      # grabber at priority 245, owned by HyperHDR -> light.hyperhdr stays
      # 'off' the whole film. The ESP32 read that as "HyperHDR: off" for a
      # week (2026-09-16). This is what "ambilight is running" actually means.
      - name: "Ambilight movie"
        unique_id: ambilight_movie_active
        device_class: running
        icon: mdi:movie-open
        state: >-
          {% set h = states.light.hyperhdr %}
          {{ h is not none and h.state != 'unavailable'
             and h.attributes.get('connection_status') == 'Connected'
             and h.attributes.get('active_component') in ['SYSTEMGRABBER', 'VIDEOGRABBER'] }}
        attributes:
          connection: "{{ state_attr('light.hyperhdr', 'connection_status') }}"
          component: "{{ state_attr('light.hyperhdr', 'active_component') }}"
          priority: "{{ state_attr('light.hyperhdr', 'active_priority') }}"
          mode: "{{ state_attr('light.hyperhdr', 'mode') }}"
      - name: "HyperHDR reachable"
        unique_id: ambilight_hyperhdr_reachable
        device_class: connectivity
        icon: mdi:television-ambient-light
        state: >-
          {{ has_value('light.hyperhdr') and state_attr('light.hyperhdr', 'connection_status') == 'Connected' }}
