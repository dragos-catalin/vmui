# pnpm 11 no longer reads `pnpm.onlyBuiltDependencies` from package.json --
# the allow-list lives here. Until this file was filled in it held generated
# "set this to true or false" placeholders, so every install silently skipped
# these build scripts. That left better-sqlite3 without its native binding,
# which the app needs to open the database at all.
allowBuilds:
  # The database. Without its .node binding nothing in vmui works.
  better-sqlite3: true
  # SSH bridge: ssh2 plus its optional native accelerator.
  ssh2: true
  cpu-features: true
  # Build/runtime tooling that ships prebuilt binaries.
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Pulled in transitively by the Google Cloud SDKs; its install script only
  # generates JS, so allowing it is safe and silences a warning every install.
  protobufjs: true
  # Both only download/select a prebuilt binary for the platform.
  '@parcel/watcher': true
  '@swc/core': true

packages:
  - .
  - apps/desktop

# Security pins for transitive deps (G-03 shared security gate, osv >= 7). Remove an entry once
# its parent ships the fix (Renovate dependency dashboard shows when).
overrides:
  'shell-quote': '>=1.9.0'
  '@grpc/grpc-js@1': '>=1.14.5 <2'
  'form-data@2': '>=2.5.6 <3'
  'protobufjs@7': '>=7.6.1 <8'
  'brace-expansion@1': '>=1.1.20 <2'
  'brace-expansion@2': '>=2.1.6 <3'
  'brace-expansion@5': '>=5.0.11 <6'
  'js-yaml@4': '>=4.3.2 <5'
  'nanoid@3': '>=3.3.18 <4'
  'postcss@8': '>=8.5.18 <9'
  'browserslist@4': '>=4.28.7 <5'
  'fflate@0': '>=0.8.3 <1'
  'uuid@<11.1.1': '>=11.1.1'