# /srv/homepi/ha/packages/vmui_pc.yaml — installed by scripts/pi-deploy.ps1.
# Wake the Windows PC through vmui on this Pi (magic packet from the LAN side).
# HA's own appliance token is in /config/secrets.yaml as `vmui_ha_auth`
# ("Bearer vmd_…", written by pi-deploy), never an entity state or a URL.
rest_command:
  vmui_pc_wake:
    url: "http://127.0.0.1:3737/api/pc/wake?by=ha"
    method: POST
    headers:
      authorization: !secret vmui_ha_auth
    timeout: 10

script:
  pc_wake:
    alias: "PC: pornește (Wake-on-LAN)"
    icon: mdi:power
    mode: single
    sequence:
      - action: rest_command.vmui_pc_wake

command_line:
  - binary_sensor:
      name: "PC Dragos"
      unique_id: vmui_pc_dragos_up
      command: "nc -z -w 2 192.168.100.61 22 && echo ON || echo OFF"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: power
      scan_interval: 30

# The Windows tray app (apps/desktop) publishes its state retained on
# vmui/pc/state every 15 s and executes fixed verbs from vmui/pc/cmd.
# vmui's /api/desktop/pc reads this sensor and publishes through mqtt.publish,
# so the phone never needs a broker connection of its own.
mqtt:
  sensor:
    - name: "vmui PC agent"
      unique_id: vmui_pc_agent
      state_topic: "vmui/pc/state"
      value_template: "{{ value_json.state }}"
      json_attributes_topic: "vmui/pc/state"
      icon: mdi:desktop-tower
      expire_after: 90
