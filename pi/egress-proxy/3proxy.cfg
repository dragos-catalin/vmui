# homepi Romanian egress proxy (3proxy). Synced by scripts/pi-egress-proxy.ps1
# to /srv/homepi/egress-proxy/. No secrets in this file: hashed credentials are
# in passwd (generated on the Pi from .private/egress-proxy.env, never in git).
# Adding an app = one EGRESS_PASS_<APP>= line in .private/egress-proxy.env plus
# one "app" block below. See README.md.

# connect timeout 15 s, idle tunnel closed after 10 min
timeouts 1 5 30 60 180 600 15 60 15 5
nscache 65536
maxconn 256

users $/etc/3proxy/passwd
monitor /etc/3proxy/passwd
monitor /etc/3proxy/3proxy.cfg

# stdout -> docker json-file (10m x 3). Who, where, how many bytes; never bodies.
log
logformat "G%Y-%m-%dT%H:%M:%SZ user=%U client=%C dst=%n:%r err=%E out=%O in=%I ms=%D"

auth strong

# ---- app: marcai (MarcAI ingest crawlers, D29) -----------------------------
connlim 32 0 marcai
allow marcai * api.efortuna.ro,api.casapariurilor.ro,superbet.ro,*.superbet.ro,production-superbet-offer-ro.freetls.fastly.net,eu-offering-api.kambicdn.com,sportsbook-sm-distribution-api.nsoft.com 443 HTTP_CONNECT
# ---- end app: marcai -------------------------------------------------------

# ---- app: brivio (Brivio worker news ingest: gov.ro blocks GCP + Cloudflare) -
connlim 4 0 brivio
allow brivio * gov.ro,www.gov.ro 443 HTTP_CONNECT
# ---- end app: brivio -------------------------------------------------------

deny *

# Tailscale + loopback only; never 0.0.0.0 or the LAN address.
proxy -n -a -p3128 -i127.0.0.1
proxy -n -a -p3128 -i100.82.141.110

setgid 65534
setuid 65534
