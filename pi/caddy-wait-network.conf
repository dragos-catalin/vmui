# /etc/systemd/system/caddy.service.d/10-wait-network.conf
# Caddy binds the LAN IP (tailscaled already owns :443 on the tailnet IP), so it
# must start after DHCP assigned it. Before this drop-in it died at boot with
# "listen tcp 192.168.100.232:443: bind: cannot assign requested address" and
# stayed down (2026-09-18 -> 2026-10-06).
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
Restart=on-failure
RestartSec=5s
