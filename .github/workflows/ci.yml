name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      [
        "**.md",
        "docs/**",
        "ambilight/**",
        "esp32/**",
        "pi/**",
        "turzx/**",
        "vfio/**",
      ]
  schedule:
    - cron: "29 3 * * 1" # weekly: full-history secret scan + fresh CVE data
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    if: github.event_name != 'schedule'
    uses: dragos-catalin/workflows/.github/workflows/node-ci.yml@v1
    with:
      tasks: lint typecheck test
  security:
    uses: dragos-catalin/workflows/.github/workflows/security.yml@v1
    with:
      full-history: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
