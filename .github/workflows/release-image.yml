name: release-image

# Vatra hub image (P4-02): multi-arch build -> GHCR, keyless cosign signature + SBOM attestation,
# and a channel manifest (channels/<channel>.json) that vatra-updater (P5-03) verifies before it
# pins the digest in /srv/vatra/.env. Runs on a version tag (v1.2.3 -> stable, v1.2.3-beta.1 ->
# beta) or by hand. Never pushes `latest`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to publish"
        type: choice
        options: [beta, stable]
        default: beta

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vatra

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # channel manifest is attached to the GitHub release
      packages: write
      id-token: write # keyless cosign (Fulcio) + provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Version and channel
        id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag ${GITHUB_REF_NAME} != package.json ${version}"; exit 1; }
            case "$GITHUB_REF_NAME" in *-*) channel=beta ;; *) channel=stable ;; esac
          else
            channel="${{ inputs.channel }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      # ESP32 firmware for the same version (P6-03): baked into the image so a hub serves and
      # OTA-updates its boards offline. firmware.yml builds the same thing for the release assets.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Firmware
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash firmware/build.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64 + linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign + attest SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          cosign verify "$REF" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-image.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Channel manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p channels
          node scripts/channel-manifest.mjs --channel "$CHANNEL" --version "$VERSION" --image "$IMAGE@$DIGEST" > "channels/$CHANNEL.json"
          cosign sign-blob --yes --bundle "channels/$CHANNEL.json.sigstore" "channels/$CHANNEL.json"
          cat "channels/$CHANNEL.json"

      - name: Publish manifest to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${{ steps.v.outputs.channel == 'beta' && '--prerelease' || '' }}
          gh release upload "$GITHUB_REF_NAME" channels/*.json channels/*.sigstore sbom.spdx.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: channel-${{ steps.v.outputs.channel }}
          path: |
            channels/
            sbom.spdx.json
